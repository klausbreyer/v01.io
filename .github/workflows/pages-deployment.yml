name: Deploy to Bunny

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bunny-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Bunny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Tailwind
        run: make tailwind-download

      - name: Build Tailwind
        run: make tailwind-build

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: make build

      - name: Publish site
        uses: BunnyWay/actions/deploy-site@931a74b9c45ea9f9f01435fbbf1649830e67d3b3 # deploy-site_0.1.2
        with:
          site: v01-io
          directory: public
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          cli_version: "0.19.0"
