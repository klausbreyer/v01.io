on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Tailwind
        run: make tailwind-download

      - name: Build Tailwind
        run: make tailwind-build

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: make build

      - name: Publish Page
        uses: cloudflare/wrangler-action@v3 # replaces the removed cloudflare/pages-action
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm # the repo's bun.lock would make the action pick bun, which the runner lacks
          command: pages deploy public --project-name=v01-hugo
