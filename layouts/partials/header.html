{{/* Site header: name on the left, primary navigation on the right. The current section is white. */}}
{{ $current := .RelPermalink }}
<header class="container-site flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 pt-5 pb-3 md:py-8 font-display print:px-0 print:py-0">
  <a
    lang="en"
    href="/"
    class="shrink-0 text-lg font-bold tracking-tight text-strong leading-none hover:text-primary transition-colors print:text-black"
  >
    Klaus Breyer<span class="text-primary">.</span>
  </a>

  <nav aria-label="Main" class="print:hidden">
    <ul class="-ms-0 flex gap-x-5 font-medium text-[0.9375rem] leading-none md:gap-x-7">
      {{ range .Site.Menus.header }}
      {{ $active := hasPrefix $current .URL }}
      <li>
        <a
          lang="en"
          href="{{ .URL }}"
          class="block py-3 md:py-2 {{ if $active }}text-strong underline decoration-primary decoration-1 underline-offset-[7px]{{ else }}text-[#b5b5b5] hover:text-strong{{ end }} transition-colors"
          {{ if $active }}aria-current="page"{{ end }}
        >{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
